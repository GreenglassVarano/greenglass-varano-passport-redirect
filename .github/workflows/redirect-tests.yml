# Project Passport — public experience contract tests (PASSPORT-DES-003 / ICR-005).
#
# Runs on every push and pull request. Offline: no network, no secrets, no deployment.
#   1. Routing + rendering contract — imports the SHIPPED lib/passport.mjs (the Pages
#      Functions are one-line wrappers over it) and serves this repository's own files.
#   2. Public data + media leak test — allowlist, denylist, hashes, manifest, and a
#      structural metadata scan of every public JPEG / MP4.
#   3. Structural guards — the durable identity and the no-credential boundary.
# The HK09 SharePoint-302 suite (route-test.js) remains on `main` with the code it tests.
name: Public Passport contract tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Routing + rendering contract (invokes the shipped renderer)
        run: node tests/public-routing.test.mjs

      - name: Public data + media leak test
        run: node tests/public-data-leak.test.mjs

      - name: CNAME must remain the durable public identity
        run: |
          set -e
          expected="passport.greenglassvarano.com"
          actual="$(tr -d '[:space:]' < CNAME)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::CNAME is '$actual', expected '$expected'"
            exit 1
          fi
          echo "CNAME = $actual"

      - name: No credential, token or operational endpoint in the deployment
        run: |
          set -e
          if grep -rIniE 'client_secret|bearer |authorization:|access_token|refresh_token|login\.microsoftonline|graph\.microsoft|_api/web|sharepoint\.com' \
               --include='*.js' --include='*.mjs' --include='*.html' --include='*.json' --include='*.css' \
               lib functions assets public-data index.html 404.html; then
            echo "::error::a credential or operational endpoint appeared in a served or runtime file"
            exit 1
          fi
          echo "no credential / operational endpoint in lib, functions, assets, public-data or pages"

      - name: Only sanitized public media formats are present
        run: |
          set -e
          bad="$(find public-media -type f ! -name '*.jpg' ! -name '*.mp4' || true)"
          if [ -n "$bad" ]; then echo "::error::unexpected media files: $bad"; exit 1; fi
          echo "public-media holds only .jpg / .mp4"
